name: release

# A GitHub Release vX.Y.Z on main creates the tag and starts this workflow: test, build, publish
# the wheel and sdist to PyPI, then attach the same files and their SHA-256 sums to the release.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,paper]

      - name: Lint
        run: ruff check src/pynrpf tests publication/2_journal_article/paper

      - name: Unit tests
        run: pytest -q

      - name: Build package
        run: python -m build --sdist --wheel

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # The wheel Ausgrid copies into a Volume comes from here, with the checksum to verify it.
  attach:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Checksums
        run: |
          (cd dist && sha256sum * > ../SHA256SUMS)
          cat SHA256SUMS

      - name: Attach to the GitHub Release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
