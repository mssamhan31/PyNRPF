schema_version: "journal_v2"

paths:
  alpha_dataset_path: "dataset/final/dataset_alpha.parquet"
  beta_dataset_path: "dataset/final/dataset_beta.parquet"
  gamma_dataset_path: "dataset/final/dataset_gamma.parquet"
  output_base_dir: "outputs"

source_paths:
  alpha_processed_path: "dataset/processed/synthetic_pynrpf_dataset.parquet"
  beta_processed_path: "dataset/oracle_data_creation/actual_pynrpf_dataset_reflagged.parquet"

columns:
  site: "substation_id"
  date: "date"
  timestamp: "timestamp"
  net_load: "net_load_MW"
  solar: "solar_MW"
  label_interval: "label_interval"
  label_day: "label_day"

datasets:
  alpha_name: "Alpha"
  beta_name: "Beta"
  gamma_name: "Gamma"
  beta_review_status: "final_review_2026-07-06"

gamma:
  selection_mode: "auto"
  ranking_metric: "data_error_rmse_MW"
  manual_site: null

windows:
  train_start: "2021-11-01"
  train_end: "2023-09-30"
  test_start: "2023-10-01"
  test_end: "2024-09-30"
  beta_start: "2023-10-01"
  beta_end: "2024-09-30"
  gamma_forecast_test_start: "2024-09-01"
  gamma_forecast_test_end: "2024-09-30"

outputs:
  intermediate_dir: "intermediate"
  metrics_dir: "metrics"
  tables_dir: "tables"
  figures_dir: "figures"
  manifests_dir: "manifests"

execution:
  run_full_correction_validation: true
  run_full_forecast: false
  reuse_correction_prediction_files: false
  overwrite_outputs: true
  random_seed: 9

correction:
  methods:
    - "m8_xgb"
    - "m7_dtr"
  alpha_top_n_loso_sites: 10
  interval_daytime_start_hour: 6
  interval_daytime_end_hour: 18
  m7_threshold:
    solar_peak_tiebreak_time: "12:30"
    peak_window_minutes: 150
    min_threshold: 0.05
    min_threshold_both: 0.25
    apply_polarity_filter: false
  m8_xgb:
    noon_hour_start: 6
    noon_hour_end: 18
    holiday_country: "AU"
    holiday_subdivision: "NSW"
    xgb1_day:
      objective: "binary:logistic"
      eval_metric: "aucpr"
      tree_method: "hist"
      eta: 0.1
      n_estimators: 500
      max_depth: 6
      min_child_weight: 3
      subsample: 0.8
      colsample_bytree: 0.8
      scale_pos_weight: 5
      seed: 9
      threshold: 0.585985
    xgb2_timestamp:
      objective: "binary:logistic"
      eval_metric: "aucpr"
      tree_method: "hist"
      eta: 0.1
      n_estimators: 500
      max_depth: 6
      min_child_weight: 3
      subsample: 0.8
      colsample_bytree: 0.8
      scale_pos_weight: 5
      seed: 9
      threshold: 0.892234
      score_all_days_for_review: false

forecast:
  horizon_days: 7
  lookback_days: 14
  roll_frequency: "15min"
  models:
    - "seasonal_naive"
    - "linear_regression"
    - "xgboost"
  xgboost:
    objective: "reg:squarederror"
    tree_method: "hist"
    eta: 0.05
    n_estimators: 300
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
    seed: 9
