[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynrpf"
version = "0.4.0"
description = "Detect and correct a wrong reverse-power-flow sign in fifteen-minute net-load data (M9)."
readme = "README.MD"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "M. Syahman Samhan", email = "m.samhan@unsw.edu.au" }
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
# Fitting both calibration numbers (the paper's per-fold fits); the intercept-only refit needs nothing extra.
fit = ["scikit-learn>=1.4,<2"]
# The Spark adapter.
spark = ["pyspark>=3.4,<4"]
# Reproducing the journal paper: baselines, folds, figures, notebooks.
paper = [
  "scikit-learn>=1.4,<2",
  "xgboost>=2,<3",
  "holidays>=0.40,<1",
  "pyyaml>=6,<7",
  "pyarrow>=14,<23",
  "matplotlib>=3.7,<4",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
  "tabulate>=0.9,<1",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "build>=1.2,<2",
  "mkdocs>=1.5,<2",
  "mkdocs-material>=9,<10",
  "pyarrow>=14,<23",
  "scikit-learn>=1.4,<2",
]

[project.scripts]
pynrpf = "pynrpf.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pynrpf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
