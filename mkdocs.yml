site_name: PyNRPF
site_description: Detect and correct a wrong reverse-power-flow sign in fifteen-minute net-load data
repo_url: https://github.com/mssamhan31/PyNRPF
docs_dir: docs
theme:
  name: material
  palette:
    primary: blue grey
    accent: orange
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Use it:
      - Install: install.md
      - Quick start: quickstart.md
      - Spark: spark.md
      - Command line: cli.md
      - API: api.md
  - Understand it:
      - Method: method.md
      - Calibration: calibration.md
      - Overrides: overrides.md
  - The paper:
      - Data: data.md
      - Evaluation: evaluation.md
      - Reproduce: reproduce.md
  - Development: development.md
